<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة صائد القطط 🐱</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #1e1e2f;
            color: white;
            margin: 0;
            padding: 20px;
            user-select: none;
        }

        h1 { 
            margin-bottom: 10px; 
            color: #ff6b6b; 
        }

        .stats {
            display: inline-flex;
            justify-content: center;
            gap: 30px;
            font-size: 22px;
            margin-bottom: 20px;
            background: #2b2b40;
            padding: 10px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        #game-area {
            width: 90%;
            max-width: 450px;
            height: 400px;
            background-color: #2b2b40;
            border: 3px solid #ff6b6b;
            border-radius: 20px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        #cat {
            font-size: 55px;
            position: absolute;
            cursor: pointer;
            display: none;
            transition: transform 0.1s;
        }

        #cat:active {
            transform: scale(0.8);
        }

        button {
            margin-top: 20px;
            padding: 12px 35px;
            font-size: 20px;
            background-color: #4ecdc4;
            color: #1e1e2f;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover { 
            background-color: #45b7af; 
        }
    </style>
</head>
<body>

    <h1>لعبة صائد القطط 🐱</h1>
    
    <div class="stats">
        <div>النقاط: <span id="score">0</span></div>
        <div>الوقت: <span id="time">30</span> ث</div>
    </div>

    <div id="game-area">
        <div id="cat" onclick="catchCat()">🐱</div>
    </div>

    <button id="start-btn" onclick="startGame()">ابدأ اللعب</button>

    <script>
        let score = 0;
        let timeLeft = 30;
        let gameTimer;
        let moveTimer;
        
        const cat = document.getElementById('cat');
        const gameArea = document.getElementById('game-area');
        const startBtn = document.getElementById('start-btn');

        function startGame() {
            score = 0;
            timeLeft = 30;
            document.getElementById('score').innerText = score;
            document.getElementById('time').innerText = timeLeft;
            
            startBtn.style.display = 'none';
            cat.style.display = 'block';
            
            moveCat();
            
            // تحريك القطة تلقائياً كل 0.9 ثانية
            moveTimer = setInterval(moveCat, 900);
            
            // عداد الوقت التنازلي
            gameTimer = setInterval(() => {
                timeLeft--;
                document.getElementById('time').innerText = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function moveCat() {
            const maxX = gameArea.clientWidth - 70;
            const maxY = gameArea.clientHeight - 70;
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            
            cat.style.left = randomX + 'px';
            cat.style.top = randomY + 'px';
        }

        function catchCat() {
            score++;
            document.getElementById('score').innerText = score;
            moveCat(); // تنتقل القطة لمكان جديد فوراً عند اصطيادها
            
            // إعادة ضبط مؤقت الحركة لإعطاء فرصة عادلة
            clearInterval(moveTimer);
            moveTimer = setInterval(moveCat, 900);
        }

        function endGame() {
            clearInterval(gameTimer);
            clearInterval(moveTimer);
            cat.style.display = 'none';
            startBtn.style.display = 'inline-block';
            startBtn.innerText = 'العب مرة أخرى';
            alert('انتهى الوقت! مجموع نقاطك هو: ' + score + ' 🐱🎉');
        }
    </script>

</body>
</html>
