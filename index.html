<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة فلاتر الطير الصعبة 🐦</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            user-select: none;
        }
        h1 {
            margin: 5px 0 10px 0;
            color: #ffeb3b;
            font-size: 22px;
        }
        canvas {
            border: 4px solid #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            background: linear-gradient(to bottom, #4ec0ca, #87ceeb);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>لعبة فلاتر الطير الصعبة 🐦🔥</h1>
    <canvas id="gameCanvas" width="320" height="480"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // إعدادات الطائر
        let bird = {
            x: 50,
            y: 150,
            width: 30,
            height: 24,
            gravity: 0.55,     // الجاذبية (تجعله يسقط بسرعة)
            lift: -9,          // قوة القفزة
            velocity: 0
        };

        let pipes = [];
        let pipeWidth = 50;
        let pipeGap = 110;     // الفجوة ضيقة وصعبة جداً!
        let frameCount = 0;
        let score = 0;
        let highScore = 0;
        let isGameOver = true;

        // بدء اللعبة أو القفز عند النقر أو لمس الشاشة
        function triggerAction() {
            if (isGameOver) {
                resetGame();
            } else {
                bird.velocity = bird.lift;
            }
        }

        window.addEventListener("keydown", function(e) {
            if (e.code === "Space" || e.code === "ArrowUp") {
                triggerAction();
            }
        });

        canvas.addEventListener("click", triggerAction);
        canvas.addEventListener("touchstart", function(e) {
            e.preventDefault();
            triggerAction();
        });

        function resetGame() {
            bird.y = 150;
            bird.velocity = 0;
            pipes = [];
            score = 0;
            frameCount = 0;
            isGameOver = false;
        }

        function spawnPipe() {
            // ارتفاع عشوائي للأنابيب مع مسافة صعبة للتحدي
            let minHeight = 50;
            let maxHeight = canvas.height - pipeGap - 80;
            let topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

            pipes.push({
                x: canvas.width,
                top: topHeight,
                bottom: canvas.height - topHeight - pipeGap,
                passed: false
            });
        }

        function update() {
            if (isGameOver) return;

            // تطبيق الجاذبية على الطائر
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;

            // اصطدام الطائر بالأرض أو السقف
            if (bird.y + bird.height >= canvas.height - 20) {
                bird.y = canvas.height - 20 - bird.height;
                isGameOver = true;
            }
            if (bird.y <= 0) {
                bird.y = 0;
                bird.velocity = 0;
            }

            // توليد أنابيب جديدة كل 90 إطار
            if (frameCount % 90 === 0) {
                spawnPipe();
            }

            // تحريك الأنابيب وفحص الاصطدام
            for (let i = pipes.length - 1; i >= 0; i--) {
                pipes[i].x -= 2.5; // سرعة تحرك الأنابيب

                // التحقق من احتساب النقاط
                if (!pipes[i].passed && pipes[i].x + pipeWidth < bird.x) {
                    score++;
                    if (score > highScore) highScore = score;
                    pipes[i].passed = true;
                }

                // فحص الاصطدام بدقة مع الأنابيب (الطائر والأنابيب)
                if (
                    bird.x < pipes[i].x + pipeWidth &&
                    bird.x + bird.width > pipes[i].x &&
                    (bird.y < pipes[i].top || bird.y + bird.height > canvas.height - pipes[i].bottom)
                ) {
                    isGameOver = true;
                }

                // حذف الأنابيب التي خرجت من الشاشة
                if (pipes[i].x + pipeWidth < 0) {
                    pipes.splice(i, 1);
                }
            }

            frameCount++;
        }

        function draw() {
            // مسح الشاشة (السماء)
            ctx.fillStyle = "#70c5ce";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // رسم الأنابيب الخضراء
            for (let i = 0; i < pipes.length; i++) {
                ctx.fillStyle = "#73bf2e";
                ctx.strokeStyle = "#558022";
                ctx.lineWidth = 2;

                // الأنبوب العلوي
                ctx.fillRect(pipes[i].x, 0, pipeWidth, pipes[i].top);
                ctx.strokeRect(pipes[i].x, 0, pipeWidth, pipes[i].top);

                // الأنبوب السفلي
                ctx.fillRect(pipes[i].x, canvas.height - pipes[i].bottom, pipeWidth, pipes[i].bottom);
                ctx.strokeRect(pipes[i].x, canvas.height - pipes[i].bottom, pipeWidth, pipes[i].bottom);
            }

            // رسم الأرضية في الأسفل
            ctx.fillStyle = "#ded895";
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            ctx.fillStyle = "#558022";
            ctx.fillRect(0, canvas.height - 20, canvas.width, 5);

            // رسم الطائر (على شكل طائر أصفر بملامح واضحة)
            ctx.fillStyle = "#f8e71c";
            ctx.beginPath();
            ctx.arc(bird.x + bird.width/2, bird.y + bird.height/2, bird.width/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // العين
            ctx.fillStyle = "white";
            ctx.beginPath();
            ctx.arc(bird.x + bird.width - 8, bird.y + 7, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "black";
            ctx.beginPath();
            ctx.arc(bird.x + bird.width - 7, bird.y + 7, 2, 0, Math.PI * 2);
            ctx.fill();

            // المنقار
            ctx.fillStyle = "#f57c00";
            ctx.beginPath();
            ctx.moveTo(bird.x + bird.width, bird.y + 10);
            ctx.lineTo(bird.x + bird.width + 8, bird.y + 13);
            ctx.lineTo(bird.x + bird.width, bird.y + 16);
            ctx.fill();

            // رسم النقاط
            ctx.fillStyle = "white";
            ctx.font = "bold 28px Arial";
            ctx.textAlign = "center";
            ctx.fillText(score, canvas.width / 2, 50);

            // رسالة البداية أو الخسارة
            if (isGameOver) {
                ctx.fillStyle = "rgba(0, 0, 0, 0.4)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "white";
                ctx.font = "bold 26px Arial";
                ctx.fillText(score === 0 ? "اضغط للبدء 🐦" : "انتهت اللعبة! 💥", canvas.width / 2, canvas.height / 2 - 30);
                
                if (score > 0) {
                    ctx.font = "18px Arial";
                    ctx.fillText("النقاط: " + score + " | أعلى رقم: " + highScore, canvas.width / 2, canvas.height / 2 + 10);
                }

                ctx.font = "14px Arial";
                ctx.fillStyle = "#ffeb3b";
                ctx.fillText("انقر أو المس الشاشة للقفز", canvas.width / 2, canvas.height / 2 + 50);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>

</body>
</html>
