<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>صائد النجوم</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body {
      background: #0b1021;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 14px;
    }
    .panel {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      background: #151e3d;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #29386b;
    }
    input, button {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
    }
    input {
      background: #0b1021;
      color: #fff;
      border: 1px solid #384c8f;
      width: 150px;
    }
    button {
      background: #38bdf8;
      color: #061326;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #7dd3fc; }
    .hud {
      display: flex;
      gap: 20px;
      font-size: 18px;
      font-weight: 700;
    }
    canvas {
      background: radial-gradient(circle at top, #1b2754, #090d1a);
      border: 2px solid #334685;
      border-radius: 14px;
      max-width: 100%;
      touch-action: none;
    }
    .board {
      background: #151e3d;
      padding: 12px 18px;
      border-radius: 12px;
      width: 100%;
      max-width: 460px;
      border: 1px solid #29386b;
    }
    .board h3 { margin-bottom: 8px; font-size: 16px; color: #38bdf8; }
    ol { padding-right: 20px; }
    li { margin: 4px 0; font-size: 14px; }
  </style>
</head>
<body>
  <h1>صائد النجوم</h1>

  <div class="panel">
    <input id="playerName" type="text" maxlength="16" placeholder="اسم اللاعب" value="لاعب" />
    <button id="startBtn">ابدأ اللعب</button>
  </div>

  <div class="hud">
    <div>النقاط: <span id="scoreEl">0</span></div>
    <div>المحاولات المتبقية: <span id="livesEl">3</span></div>
  </div>

  <canvas id="gameCanvas" width="460" height="520"></canvas>

  <div class="board">
    <h3>أعلى النتائج</h3>
    <ol id="scoresList"></ol>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreEl');
    const livesEl = document.getElementById('livesEl');
    const startBtn = document.getElementById('startBtn');
    const playerNameInput = document.getElementById('playerName');
    const scoresList = document.getElementById('scoresList');

    const player = { x: 200, y: 475, w: 64, h: 16, speed: 6 };
    let items = [];
    let score = 0;
    let lives = 3;
    let running = false;
    let keys = {};
    let spawnTimer = 0;

    async function loadScores() {
      try {
        const res = await fetch('/api/scores');
        const data = await res.json();
        scoresList.innerHTML = data
          .map((row) => `<li>${row.name} — ${row.score}</li>`)
          .join('');
      } catch (_) {}
    }

    async function submitScore(finalScore) {
      if (finalScore <= 0) return;
      try {
        await fetch('/api/scores', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: playerNameInput.value,
            score: finalScore
          })
        });
        await loadScores();
      } catch (_) {}
    }

    function startGame() {
      score = 0;
      lives = 3;
      items = [];
      player.x = canvas.width / 2 - player.w / 2;
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      running = true;
    }

    function spawnItem() {
      const isBomb = Math.random() < 0.25;
      items.push({
        x: Math.random() * (canvas.width - 28) + 14,
        y: -14,
        r: 12,
        speed: 2.5 + Math.min(score * 0.04, 5),
        isBomb
      });
    }

    function update() {
      if (!running) return;

      if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed;
      player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

      spawnTimer++;
      const interval = Math.max(22, 55 - Math.floor(score / 10) * 3);
      if (spawnTimer >= interval) {
        spawnTimer = 0;
        spawnItem();
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.speed;

        const hit =
          item.y + item.r >= player.y &&
          item.y - item.r <= player.y + player.h &&
          item.x >= player.x &&
          item.x <= player.x + player.w;

        if (hit) {
          if (item.isBomb) {
            lives--;
            livesEl.textContent = lives;
            if (lives <= 0) {
              running = false;
              submitScore(score);
            }
          } else {
            score += 10;
            scoreEl.textContent = score;
          }
          items.splice(i, 1);
          continue;
        }

        if (item.y - item.r > canvas.height) {
          items.splice(i, 1);
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Player paddle
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.roundRect(player.x, player.y, player.w, player.h, 8);
      ctx.fill();

      // Falling items
      for (const item of items) {
        ctx.beginPath();
        ctx.arc(item.x, item.y, item.r, 0, Math.PI * 2);
        ctx.fillStyle = item.isBomb ? '#ef4444' : '#facc15';
        ctx.fill();
      }

      if (!running) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 24px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('اضغط "ابدأ اللعب"', canvas.width / 2, canvas.height / 2);
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => { keys[e.key] = true; });
    window.addEventListener('keyup', (e) => { keys[e.key] = false; });

    canvas.addEventListener('pointermove', (e) => {
      if (!running) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const pointerX = (e.clientX - rect.left) * scaleX;
      player.x = Math.max(0, Math.min(canvas.width - player.w, pointerX - player.w / 2));
    });

    startBtn.addEventListener('click', startGame);
    loadScores();
    loop();
  </script>
</body>
</html>
