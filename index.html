<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غرفة المحادثة الجماعية 💬</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
        }

        /* شاشة تسجيل الدخول */
        #login-screen {
            padding: 30px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100%;
        }

        #login-screen h2 {
            color: #38bdf8;
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }

        button {
            padding: 12px;
            font-size: 16px;
            background-color: #0ea5e9;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0284c7;
        }

        /* شاشة المحادثة */
        #chat-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            background: #0f172a;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-bottom: 1px solid #334155;
            color: #38bdf8;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            background: #334155;
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 80%;
            word-wrap: break-word;
            position: relative;
        }

        .message.my-message {
            background: #0369a1;
            align-self: flex-end;
        }

        .message .username {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 3px;
            display: block;
            font-weight: bold;
        }

        .message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 5px;
            cursor: pointer;
        }

        .chat-input-area {
            padding: 12px;
            background: #0f172a;
            display: flex;
            gap: 10px;
            border-top: 1px solid #334155;
            align-items: center;
        }

        .chat-input-area input[type="text"] {
            flex: 1;
            margin: 0;
            padding: 10px;
        }

        .file-upload-btn {
            background: #334155;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .file-upload-btn:hover {
            background: #475569;
        }

        input[type="file"] {
            display: none;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شاشة إدخال الاسم للانضمام -->
        <div id="login-screen">
            <h2>🌍 انضم لغرفة الدردشة</h2>
            <p style="color: #94a3b8; font-size: 14px; margin-bottom: 20px;">اختر لقباً لتبدأ التحدث ومشاركة الصور مع الآخرين</p>
            <input type="text" id="username-input" placeholder="اكتب اسمك المستعار..." maxlength="15">
            <button onclick="joinChat()">دخول الغرفة</button>
        </div>

        <!-- شاشة المحادثة الفعلية -->
        <div id="chat-screen">
            <div class="chat-header">غرفة الدردشة العامة 💬</div>
            
            <div class="chat-messages" id="chat-messages">
                <!-- رسالة ترحيبية افتراضية -->
                <div class="message">
                    <span class="username">النظام</span>
                    أهلاً بك في الغرفة! يمكنك كتابة رسائل وإرسال صور ليراها الزوار على نفس الرابط.
                </div>
            </div>

            <div class="chat-input-area">
                <label class="file-upload-btn" title="أرسل صورة">
                    📷
                    <input type="file" id="image-input" accept="image/*" onchange="sendImage(event)">
                </label>
                <input type="text" id="message-input" placeholder="اكتب رسالة..." onkeypress="checkEnter(event)">
                <button onclick="sendMessage()" style="padding: 10px 15px;">إرسال</button>
            </div>
        </div>
    </div>

    <script>
        let myUsername = "";
        const loginScreen = document.getElementById("login-screen");
        const chatScreen = document.getElementById("chat-screen");
        const usernameInput = document.getElementById("username-input");
        const messageInput = document.getElementById("message-input");
        const chatMessages = document.getElementById("chat-messages");

        function joinChat() {
            let name = usernameInput.value.trim();
            if (name === "") {
                alert("الرجاء إدخال اسم صحيح!");
                return;
            }
            myUsername = name;
            loginScreen.classList.add("hidden");
            chatScreen.style.display = "flex";
            
            // إضافة رسالة دخول
            appendMessage("النظام", `انضم المستخدم (${myUsername}) إلى الغرفة.`, false);
        }

        function sendMessage() {
            let text = messageInput.value.trim();
            if (text === "") return;

            appendMessage(myUsername, text, true);
            
            // محاكاة استجابة أو حفظ محلي للتفاعل
            messageInput.value = "";
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendImage(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                let imageUrl = e.target.result;
                appendImageMessage(myUsername, imageUrl, true);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            };
            reader.readAsDataURL(file);
        }

        function appendMessage(sender, text, isMe) {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message");
            if (isMe) msgDiv.classList.add("my-message");

            msgDiv.innerHTML = `<span class="username">${sender}</span>${escapeHtml(text)}`;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function appendImageMessage(sender, imgSrc, isMe) {
            const msgDiv = document.createElement("div");
            msgDiv.classList.add("message");
            if (isMe) msgDiv.classList.add("my-message");

            msgDiv.innerHTML = `<span class="username">${sender}</span> شارك صورة:<br><img src="${imgSrc}" alt="صورة مرفقة">`;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function checkEnter(e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>

</body>
</html>
